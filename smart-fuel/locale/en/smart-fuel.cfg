[mod-name]
smart-fuel=Smart Fuel

[mod-description]
smart-fuel=Furnaces, boilers, burner drills and inserters, locomotives, cars, heating towers, nuclear reactors and biochambers keep themselves fuelled: construction robots bring fuel from the logistic network (the hub on space platforms). Vehicles get the best fuel; machines get the most plentiful basic fuel and never your rocket or nuclear fuel.

[mod-setting-name]
sf-fill-percent=Fill to (% of a stack)
sf-refill-percent=Refill when below (% of the amount filled)
sf-vehicle-upgrade=Swap worse fuel for better fuel in vehicles
sf-stationary-never=Fuels never put in machines
sf-never=Fuels never used at all
sf-reactors=Fuel nuclear reactors
sf-reactor-keep=Fuel cells to keep in each reactor
sf-biochambers=Feed biochambers
sf-nutrient-keep=Nutrients to keep in each biochamber
sf-heating-towers=Fuel heating towers
sf-remove-burnt=Take away used-up fuel (spent fuel cells and similar)
sf-per-tick=Machines checked per tick

[mod-setting-description]
sf-fill-percent=How full a machine or vehicle is filled: 100 = one full stack of that fuel (50 coal, 100 wood, 20 rocket fuel...).
sf-refill-percent=A machine asks for more fuel when it drops below this share of the amount filled. Machines that inserters keep full never ask.
sf-vehicle-upgrade=Locomotives, cars and tanks get the fuel with the biggest speed and acceleration bonus (nuclear > rocket > solid > coal). When the network has a full load of better fuel, the old fuel is taken back to storage. Only while the vehicle is standing still.
sf-stationary-never=Internal item names, separated by commas. Furnaces, boilers, drills, inserters and heating towers never get these. They prefer basic fuel (coal, wood, carbon...) - whichever the network has most of - and use solid fuel only when there is no basic fuel.
sf-never=Internal item names, separated by commas, that are never requested for anything.
sf-reactors=Keep nuclear reactors stocked with fuel cells. Reactors burn a cell whether or not the power is needed, so this keeps only a few cells in each.
sf-reactor-keep=A reactor asks for more when its fuel slot is empty (one cell still burning).
sf-biochambers=Keep biochambers fed with nutrients. Nutrients spoil, so only a small amount is kept.
sf-nutrient-keep=How many nutrients each biochamber keeps.
sf-heating-towers=Heating towers burn about 40 MW (roughly 10 coal a second), so robot-feeding them can drain your fuel and keep many robots busy. Off by default; they're usually fed by belts.
sf-remove-burnt=Construction robots carry used-up fuel (like depleted uranium fuel cells) back to storage.
sf-per-tick=Machines are checked in rotation, at most once a second each. Lower this if a huge base loses UPS.

[sf-gui]
title=Fuel
auto=Automatic: vehicles get the best fuel; machines get the most plentiful basic fuel.
locked=Only this fuel is used. Any other fuel is taken back to storage.
pick-tooltip=Pick the fuel for this machine (only fuel it can burn). Shift + right-click / left-click copies it to others, and blueprints remember it.
auto-button=Auto
auto-tooltip=Go back to choosing the fuel automatically.
nothing=This machine can't burn any fuel you allow (check the "Fuels never used at all" setting).
